name: Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3.4.1
        with:
          node-version: 22.x

      - name: Install pnpm globally
        run: npm install -g pnpm@9.15.9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:ci

      - name: Type check
        run: pnpm exec tsc --noEmit --incremental false

      - name: Build extension
        run: pnpm build

      - name: Include runtime license notices
        run: node scripts/release/notices.cjs

      - name: Audit production manifest and bundle
        run: node scripts/release/audit-bundle.cjs > "$RUNNER_TEMP/release-bundle-audit.json"

      - name: Preserve production audit
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-audit
          path: ${{ runner.temp }}/release-bundle-audit.json
          retention-days: 7

      - name: Package candidate without submission
        run: |
          pnpm package
          sha256sum build/chrome-mv3-prod.zip > build/chrome-mv3-prod.zip.sha256

      - name: Preserve installable candidate
        uses: actions/upload-artifact@v4
        with:
          name: youcoder-candidate
          path: |
            build/chrome-mv3-prod.zip
            build/chrome-mv3-prod.zip.sha256
          retention-days: 7
