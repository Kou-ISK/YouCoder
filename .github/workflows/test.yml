name: Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v3.4.1
        with:
          node-version: 22.x

      - name: Install pnpm globally
        run: npm install -g pnpm@9.15.9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:ci

      - name: Verify candidate submission gates with synthetic fixtures
        run: python3 -m unittest discover -s scripts/release -p '*_test.py' -v

      - name: Type check
        run: pnpm exec tsc --noEmit --incremental false

      - name: Build extension
        run: pnpm build

      - name: Include runtime license notices
        run: node scripts/release/notices.cjs

      - name: Audit production manifest and bundle
        run: node scripts/release/audit-bundle.cjs > "$RUNNER_TEMP/release-bundle-audit.json"

      - name: Preserve production audit
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-audit
          path: ${{ runner.temp }}/release-bundle-audit.json
          retention-days: 7

      - name: Package candidate without submission
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BUNDLE_AUDIT: ${{ runner.temp }}/release-bundle-audit.json
        run: |
          pnpm package
          python3 scripts/release/candidate.py create --directory build/reviewed-candidate

      - name: Preserve installable candidate
        uses: actions/upload-artifact@v4
        with:
          name: youcoder-candidate
          path: build/reviewed-candidate/
          retention-days: 7
